input {
  tcp {
    port => 5000
    codec => json
  }
  
  file {
    path => "/logs/**/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => multiline {
      pattern => "^%{TIMESTAMP_ISO8601}"
      negate => true
      what => "previous"
    }
  }
}

filter {
  # Parse JSON logs
  if [type] == "hcx-gateway" or [type] == "hcx-api" {
    json {
      source => "message"
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
    
    # Extract log level
    if [level] {
      mutate {
        lowercase => [ "level" ]
      }
    }
  }
  
  # Parse Java stack traces
  if [message] =~ /^(\s+at\s|Caused by:)/ {
    mutate {
      add_field => { "stack_trace" => "true" }
    }
  }
  
  # Add environment metadata
  mutate {
    add_field => {
      "environment" => "development"
      "platform" => "hcx"
    }
  }
  
  # GeoIP enrichment if IP field exists
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "hcx-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Debug output (comment out in production)
  stdout {
    codec => rubydebug
  }
}
