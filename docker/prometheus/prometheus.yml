global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hcx-platform'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
  
  - job_name: 'hcx-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['hcx-gateway:8080']
        labels:
          service: 'gateway'
          application: 'hcx-platform'
  
  - job_name: 'hcx-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['hcx-api:8081']
        labels:
          service: 'api'
          application: 'hcx-platform'
  
  - job_name: 'ai-policy-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-policy-service:8000']
        labels:
          service: 'ai-policy'
          application: 'hcx-platform'
  
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          database: 'hcx'
  
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          cache: 'hcx'
