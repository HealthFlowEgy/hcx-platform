server:
  port: 8080

spring:
  application:
    name: hcx-gateway-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hcx}
    username: ${DATABASE_USERNAME:hcx_user}
    password: ${DATABASE_PASSWORD:hcx_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# HCX Configuration
hcx:
  participant:
    code: ${HCX_PARTICIPANT_CODE:PROVIDER001}
  gateway:
    url: ${HCX_GATEWAY_URL:https://hcx-gateway.healthcare.gov}
  protocol:
    version: ${HCX_PROTOCOL_VERSION:0.9}

# FHIR Configuration
fhir:
  service:
    url: ${FHIR_SERVICE_URL:http://localhost:8083}

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.healthcare.hcx: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
