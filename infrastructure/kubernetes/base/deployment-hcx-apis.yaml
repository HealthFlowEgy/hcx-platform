apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcx-apis
  labels:
    app: hcx-apis
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hcx-apis
  template:
    metadata:
      labels:
        app: hcx-apis
        component: backend
    spec:
      containers:
      - name: hcx-apis
        image: ghcr.io/healthflowegy/hcx-platform/hcx-apis:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SERVER_PORT
          value: "8081"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: hcx-config
              key: database.url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: hcx-secrets
              key: database.username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hcx-secrets
              key: database.password
        - name: SPRING_REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: hcx-config
              key: redis.host
        - name: SPRING_REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: hcx-config
              key: redis.port
        - name: HCX_PROTOCOL_VERSION
          value: "0.9"
        - name: HCX_REGISTRY_URL
          valueFrom:
            configMapKeyRef:
              name: hcx-config
              key: hcx.registry.url
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/hcx/health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/hcx/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hcx-apis-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hcx-apis
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

