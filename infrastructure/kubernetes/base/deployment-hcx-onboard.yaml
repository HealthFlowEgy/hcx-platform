apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcx-onboard
  labels:
    app: hcx-onboard
    component: onboarding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hcx-onboard
  template:
    metadata:
      labels:
        app: hcx-onboard
        component: onboarding
    spec:
      containers:
      - name: hcx-onboard
        image: ghcr.io/healthflowegy/hcx-platform/hcx-onboard:latest
        ports:
        - containerPort: 8082
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: SERVER_PORT
          value: "8082"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: hcx-config
              key: database.url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: hcx-secrets
              key: database.username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hcx-secrets
              key: database.password
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 5
