apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hcx-dev

bases:
  - ../../base

commonLabels:
  environment: development

images:
  - name: ghcr.io/healthflowegy/hcx-platform/api-gateway
    newTag: latest
  - name: ghcr.io/healthflowegy/hcx-platform/hcx-apis
    newTag: latest
  - name: ghcr.io/healthflowegy/hcx-platform/hcx-onboard
    newTag: latest

configMapGenerator:
  - name: hcx-config
    behavior: merge
    literals:
      - database.url=jdbc:postgresql://postgres.hcx-dev.svc.cluster.local:5432/hcx_dev
      - redis.host=redis.hcx-dev.svc.cluster.local
      - hcx.registry.url=https://dev-registry.hcx.healthflowegy.com

patches:
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: hcx-apis
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Ingress
      name: hcx-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.hcx.healthflowegy.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.hcx.healthflowegy.com

