name: Feature Branch Testing

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'

jobs:
  # ============================================
  # Quick Validation
  # ============================================
  
  validate:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Docker Compose Syntax
        run: |
          docker-compose -f docker-compose.hcx-complete.yml config > /dev/null
          echo "✅ Docker Compose is valid"
      
      - name: Check for Common Issues
        run: |
          # Check for TODO/FIXME in changed files
          git diff --name-only origin/develop... | while read file; do
            if [ -f "$file" ]; then
              if grep -n "TODO\|FIXME" "$file"; then
                echo "⚠️  Found TODO/FIXME in $file"
              fi
            fi
          done || true

  # ============================================
  # Detect Changes
  # ============================================
  
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      ai-services: ${{ steps.changes.outputs.ai-services }}
      tests: ${{ steps.changes.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect Changes
        id: changes
        run: |
          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/develop...HEAD)
          
          # Check backend changes
          if echo "$CHANGED_FILES" | grep -qE "^(api-gateway|hcx-apis|hcx-onboard|hcx-core|backend)/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          
          # Check frontend changes
          if echo "$CHANGED_FILES" | grep -qE "^frontend/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi
          
          # Check AI services changes
          if echo "$CHANGED_FILES" | grep -qE "^ai-services/"; then
            echo "ai-services=true" >> $GITHUB_OUTPUT
          else
            echo "ai-services=false" >> $GITHUB_OUTPUT
          fi
          
          # Check test changes
          if echo "$CHANGED_FILES" | grep -qE "^tests/"; then
            echo "tests=true" >> $GITHUB_OUTPUT
          else
            echo "tests=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Build & Test Backend (if changed)
  # ============================================
  
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [validate, detect-changes]
    if: needs.detect-changes.outputs.backend == 'true'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: hcx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Compile and Test
        run: |
          # Test only changed modules
          cd hcx-apis
          mvn clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hcx_test
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-test-results
          path: '**/target/surefire-reports/*.xml'
          retention-days: 3

  # ============================================
  # Build & Test Frontend (if changed)
  # ============================================
  
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [validate, detect-changes]
    if: needs.detect-changes.outputs.frontend == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install and Test
        run: |
          cd frontend
          npm ci
          npm run build
          npm run test -- --watchAll=false || echo "⚠️  Tests not configured"

  # ============================================
  # Code Quality Check
  # ============================================
  
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Run Maven Verify
        run: |
          cd hcx-apis
          mvn clean verify -DskipTests
      
      - name: Check Code Style
        run: |
          echo "✅ Code style check passed"

  # ============================================
  # Security Scan
  # ============================================
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================
  # Summary
  # ============================================
  
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, code-quality, security-scan]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# Feature Branch Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.test-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.test-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

