version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15
    container_name: hcx-postgres
    environment:
      POSTGRES_DB: hcx
      POSTGRES_USER: hcx_user
      POSTGRES_PASSWORD: hcx_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - hcx-network

  # Message Queue Services
  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: hcx-zookeeper
    ports:
      - "2181:2181"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:2181
    networks:
      - hcx-network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: hcx-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_HOST_NAME: 127.0.0.1
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: yes
    depends_on:
      - zookeeper
    networks:
      - hcx-network

  # Cache Service
  redis:
    image: redis:7-alpine
    container_name: hcx-redis
    ports:
      - "6379:6379"
    networks:
      - hcx-network

  # HCX Core Services
  hcx-apis:
    build:
      context: ./hcx-apis
      dockerfile: Dockerfile
    image: healthflowegy/hcx-platform:apis-latest
    container_name: hcx-apis
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=hcx
      - DB_USER=hcx_user
      - DB_PASSWORD=hcx_password
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - kafka
      - redis
    networks:
      - hcx-network

  # NEW: HCX Gateway Service
  hcx-gateway:
    build:
      context: ./backend/hcx-gateway-service
      dockerfile: Dockerfile
    container_name: hcx-gateway
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - HCX_PARTICIPANT_CODE=PROVIDER001
      - HCX_GATEWAY_URL=https://hcx-gateway.healthcare.gov
      - HCX_PROTOCOL_VERSION=0.9
      - DATABASE_URL=jdbc:postgresql://postgres:5432/hcx
      - DATABASE_USERNAME=hcx_user
      - DATABASE_PASSWORD=hcx_password
      - REDIS_URL=redis://redis:6379
      - FHIR_SERVICE_URL=http://hcx-fhir-service:8080
    depends_on:
      - postgres
      - redis
    networks:
      - hcx-network

  # NEW: HCX FHIR Service
  hcx-fhir-service:
    build:
      context: ./backend/hcx-fhir-service
      dockerfile: Dockerfile
    container_name: hcx-fhir-service
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - FHIR_BASE_URL=http://localhost:8080/fhir
      - HCX_GATEWAY_URL=http://hcx-gateway:8080
      - DATABASE_URL=jdbc:postgresql://postgres:5432/hcx
      - DATABASE_USERNAME=hcx_user
      - DATABASE_PASSWORD=hcx_password
    depends_on:
      - postgres
    networks:
      - hcx-network

  # API Gateway (Updated with HCX routes)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: healthflowegy/hcx-platform:api-gateway-latest
    container_name: hcx-api-gateway
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - HCX_APIS_URL=http://hcx-apis:8080
      - HCX_GATEWAY_URL=http://hcx-gateway:8080
    depends_on:
      - hcx-apis
      - hcx-gateway
    networks:
      - hcx-network

  # Demo Application (Updated with HCX components)
  demo-app:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: hcx-demo-app
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8090
      - REACT_APP_HCX_API_BASE_URL=http://localhost:8082/api/v1/hcx
      - REACT_APP_FEATURE_HCX_ENABLED=true
    depends_on:
      - api-gateway
      - hcx-gateway
    networks:
      - hcx-network

  # Onboarding Application
  onboarding-app:
    build:
      context: ./onboarding-app
      dockerfile: Dockerfile
    container_name: hcx-onboarding-app
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8090
      - REACT_APP_HCX_API_BASE_URL=http://localhost:8082/api/v1/hcx
    depends_on:
      - api-gateway
      - hcx-gateway
    networks:
      - hcx-network

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    container_name: hcx-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - hcx-network

  grafana:
    image: grafana/grafana:latest
    container_name: hcx-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - hcx-network

volumes:
  postgres_data:
  grafana_data:

networks:
  hcx-network:
    driver: bridge
